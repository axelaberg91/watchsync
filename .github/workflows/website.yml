name: Website checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: python website/tools/validate_site.py
      - run: python website/tools/build_worker.py
      - run: node --check website/dist/worker.mjs
      - run: node --check website/site/assets/releases.js
      - run: npm run check:package
        working-directory: website
      - run: node website/tools/check_deploy_guard.mjs
      - run: node website/tools/check_languages.mjs
      - run: node website/tools/check_releases.mjs
      - run: node website/tools/check_release_gate.mjs
      - run: python website/tools/build_pages.py
      - run: python website/tools/check_pages.py
      - run: node website/tools/check_redirect.mjs
